openapi: 3.1.0
info:
  title: Smart Canteen Enterprise MVP API
  version: 0.9.0
  description: Database-backed campus smart canteen API with RBAC, tenant management, menu operations, authenticated uploads, student review overview, moderated campus posts, dual retrieval workflows, RAG evidence, agent routing, vision meal analysis, AI usage metering and quota governance. RAG is used for recall and explanation only; tenant authorization, price, inventory, sold-out state, serving windows and allergen constraints always come from relational SQL data.
servers:
  - url: /api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalMetricsToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, description: Stable business error code when applicable. }
        requestId: { type: string }
    AdminCatalogTreeResponse:
      type: object
      required: [regions, total]
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/AdminCatalogRegion'
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        include: { type: string, enum: [summary, dishes] }
    AdminCatalogRegion:
      type: object
      required: [id, name, defaultName, displayName, position, venueType, areaType, areaLabel, labels, missing, counts, canteens, unassignedStalls]
      properties:
        id: { type: string, enum: [campus-main, north-zone, south-zone, east-zone] }
        name: { type: string, description: Current tenant-owned venue name from the database, or the default name when the fixed venue record is missing. }
        defaultName: { type: string, description: Stable fallback name for the fixed venue slot. }
        displayName: { type: string, description: Context-ready venue display name. }
        position: { type: string, enum: [top-left, top-right, bottom-left, bottom-right] }
        venueType: { type: string, enum: [dining_complex, multi_floor_canteen] }
        areaType: { type: string, enum: [restaurant, floor_area] }
        areaLabel: { type: string, enum: [餐厅, 楼层餐区] }
        labels:
          type: object
          required: [venue, area, stall, dish]
          properties:
            venue: { type: string, example: 餐饮场所 }
            area: { type: string, description: 餐厅 for the dining complex; 楼层餐区 for multi-floor canteens. }
            stall: { type: string, example: 档口 }
            dish: { type: string, example: 菜品 }
        missing: { type: boolean, description: True when the fixed region record is not present for this tenant. }
        region: { type: [object, 'null'], description: Backward-compatible underlying canteen record for this fixed venue. }
        counts:
          type: object
          required: [canteens, stalls, dishes, openStalls]
          properties:
            canteens: { type: integer, minimum: 0 }
            stalls: { type: integer, minimum: 0 }
            dishes: { type: integer, minimum: 0 }
            openStalls: { type: integer, minimum: 0 }
        canteens:
          type: array
          items: { $ref: '#/components/schemas/AdminCatalogCanteen' }
        unassignedStalls:
          type: array
          description: Legacy top-level stalls attached directly to the venue and awaiting assignment to an area.
          items: { $ref: '#/components/schemas/AdminCatalogStallNode' }
    AdminCatalogCanteen:
      type: object
      properties:
        canteen: { type: object }
        displayName: { type: string }
        areaType: { type: string, enum: [restaurant, floor_area] }
        areaLabel: { type: string, enum: [餐厅, 楼层餐区] }
        primaryStallCount: { type: integer, minimum: 0 }
        stallCount: { type: integer, minimum: 0 }
        openStallCount: { type: integer, minimum: 0 }
        dishCount: { type: integer, minimum: 0 }
        stalls:
          type: array
          items: { $ref: '#/components/schemas/AdminCatalogStallNode' }
    AdminCatalogStallNode:
      type: object
      properties:
        stall:
          type: object
          properties:
            id: { type: string }
            canteenId: { type: string }
            parentId: { type: [string, 'null'] }
            name: { type: string }
        legacyHierarchy: { type: boolean, description: True for a retained historical child-stall node. }
        childCount: { type: integer, minimum: 0 }
        dishCount: { type: integer, minimum: 0 }
        directDishes:
          type: array
          description: Returned only when include=dishes.
          items: { type: object }
        children:
          type: array
          items: { $ref: '#/components/schemas/AdminCatalogStallNode' }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: Student phone number or legacy username/account. }
        username: { type: string, deprecated: true, description: Compatibility alias for identifier. }
        password: { type: string }
    VerificationCodeRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { type: string, pattern: '^1[3-9]\d{9}$' }
        purpose: { type: string, enum: [register, reset_password] }
    RegisterRequest:
      type: object
      required: [phone, verificationCode, password, agreementVersion]
      description: Public registration always creates a student with a pending health-profile onboarding state.
      properties:
        phone: { type: string, pattern: '^1[3-9]\d{9}$' }
        verificationCode: { type: string, pattern: '^\d{6}$' }
        password: { type: string, minLength: 8, maxLength: 72, description: Must contain at least one letter and one digit. }
        nickname: { type: string }
        agreementVersion: { type: string, maxLength: 32 }
    WechatLoginRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Temporary code returned by uni.login/wx.login. }
        phoneCode: { type: string, description: One-time getPhoneNumber code. Required when creating or binding an account. }
        agreementVersion: { type: string, maxLength: 32, description: Required for a newly created or newly bound account. }
        profile:
          type: object
          properties:
            nickName: { type: string, maxLength: 32 }
    PasswordResetRequest:
      type: object
      required: [phone, verificationCode, newPassword]
      properties:
        phone: { type: string, pattern: '^1[3-9]\d{9}$' }
        verificationCode: { type: string, pattern: '^\d{6}$' }
        newPassword: { type: string, minLength: 8, maxLength: 72, description: Must contain at least one letter and one digit. }
    PublicUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        nickname: { type: string }
        role: { type: string }
        tenantId: { type: string }
        maskedPhone: { type: string, example: '138****8000' }
        phoneVerified: { type: boolean }
    AuthSessionResponse:
      type: object
      required: [user, token, accessToken, refreshToken, expiresIn, refreshExpiresIn]
      properties:
        user: { $ref: '#/components/schemas/PublicUser' }
        token: { type: string, description: Compatibility alias for accessToken. }
        accessToken: { type: string, description: Short-lived JWT; default lifetime is 15 minutes. }
        refreshToken: { type: string, description: Opaque rotating token; default session lifetime is 30 days. }
        expiresIn: { type: integer, example: 900 }
        refreshExpiresIn: { type: integer, example: 2592000 }
        state: { type: object, description: Initial application state returned by login and registration endpoints. }
        isNewUser: { type: boolean }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string, description: Allows revoking the session when the Access Token has expired. }
    ReadinessResponse:
      type: object
      required: [ok, status, checks]
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          properties:
            database: { type: boolean }
            cache:
              type: object
              properties:
                ok: { type: boolean }
                backend: { type: string, enum: [redis, memory, unknown] }
                distributed: { type: boolean }
                degraded: { type: boolean }
    RuntimeMetrics:
      type: object
      properties:
        process: { type: object }
        http: { type: object, description: Request totals, in-flight count, errors, p50/p95/p99 and status totals. }
        eventLoop: { type: object, description: Mean, p95 and maximum event-loop delay in milliseconds. }
        database: { type: object, description: PostgreSQL pool total, idle, waiting and configured maximum. }
        cache: { type: object }
        outbox: { type: object, description: Pending, processing and dead event counts. }
    UploadRequest:
      type: object
      required: [filename, contentType, dataBase64]
      properties:
        filename: { type: string }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif] }
        dataBase64: { type: string }
    Upload:
      type: object
      required: [id, filename, contentType, sizeBytes, storageKey, provider, reference, url, visibility, objectVersion]
      properties:
        id: { type: string }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        storageKey: { type: string, description: Private owner-scoped key in the form tenant_id/user_id/upload-uuid.ext; path segments are sanitized before key generation. }
        reference: { type: string, example: 'upload://upload-uuid', description: Persistent database reference. Store this value instead of the expiring URL. }
        url: { type: string, description: 'Short-lived signed /api/uploads/{id}/content URL.' }
        visibility: { type: string, enum: [private] }
        objectVersion: { type: string, example: v1 }
        provider: { type: string, enum: [local, s3], description: local when S3_BUCKET is unset; s3 when S3_BUCKET and S3 client are configured. }
    MealVisionRequest:
      allOf:
        - { $ref: '#/components/schemas/UploadRequest' }
        - type: object
          properties:
            mode: { type: string, enum: [single_dish], default: single_dish }
            context:
              type: object
              properties:
                canteenId: { type: string, description: Required for closed-set campus dish matching. }
                stallId: { type: string, nullable: true }
                menuId: { type: string, nullable: true }
                capturedAt: { type: string, format: date-time }
                mealType: { type: string, enum: [breakfast, lunch, dinner] }
            portion:
              type: object
              properties:
                size: { type: string, enum: [small, regular, large] }
                grams: { type: number, minimum: 1, maximum: 3000, nullable: true }
    NutrientRange:
      type: object
      required: [min, max, unit]
      properties:
        min: { type: number, minimum: 0 }
        max: { type: number, minimum: 0 }
        unit: { type: string, enum: [kcal, g, mg] }
    VisionNutrition:
      type: object
      required: [status, sourceIds]
      properties:
        status: { type: string, enum: [unknown, estimated, verified] }
        basis: { type: string, enum: [per_serving, per_100g], nullable: true }
        portionGrams: { type: number, nullable: true }
        ranges:
          type: object
          nullable: true
          additionalProperties: { $ref: '#/components/schemas/NutrientRange' }
        sourceType: { type: string, enum: [recipe, manual, lab, vision], nullable: true }
        sourceIds: { type: array, items: { type: string } }
        reason: { type: string }
    VisionCandidate:
      type: object
      required: [dishId, name, canteenPath, stallPath, score, reasons]
      properties:
        dishId: { type: string }
        name: { type: string }
        imageUrl: { type: string, nullable: true }
        referenceImageUrl: { type: string, nullable: true }
        canteenPath: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } }
        stallPath: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } }
        score: { type: number, minimum: 0, maximum: 1 }
        scoreBreakdown: { type: object }
        reasons: { type: array, items: { type: string } }
    MealVisionResponse:
      type: object
      required: [analysisId, mode, context, observation, match, nutrition, warnings, source]
      properties:
        analysisId: { type: string }
        mode: { type: string, enum: [single_dish] }
        context: { type: object }
        observation: { type: object, description: Visible food observations only; never contains a claimed campus location. }
        match:
          type: object
          properties:
            status: { type: string, enum: [auto_matched, needs_confirmation, unresolved] }
            candidates: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/VisionCandidate' } }
        selectedDish: { type: object, nullable: true }
        nutrition: { $ref: '#/components/schemas/VisionNutrition' }
        warnings: { type: array, items: { type: object, properties: { code: { type: string }, message: { type: string } } } }
        source:
          type: object
          properties:
            observation: { type: string, enum: [vision-model] }
            candidateScope: { type: string, enum: [published-menu, none] }
            menuSource: { type: string, enum: [menu, none], description: Backward-compatible source.menuSource; trustworthy matching never falls back to unscoped catalog ownership. }
            visualRetrieval: { type: string, enum: [siglip, degraded] }
            location: { type: string, enum: [relational-database] }
            rawImageRetained: { type: boolean, enum: [false] }
            menuIds: { type: array, items: { type: string } }
    DishReferenceImageInput:
      type: object
      required: [uploadId]
      properties:
        uploadId: { type: string }
        purpose: { type: string, enum: [reference, evaluation], default: reference }
        angle: { type: string }
        batchKey: { type: string }
        qualityStatus: { type: string, enum: [pending, approved, rejected], default: pending }
    DishRecipeInput:
      type: object
      required: [ingredients]
      properties:
        version: { type: string }
        basis: { type: string, enum: [per_serving, per_100g], default: per_serving }
        servingWeightGrams: { type: number, minimum: 1 }
        yieldWeightGrams: { type: number, minimum: 1 }
        approve: { type: boolean, default: false }
        notes: { type: string }
        ingredients:
          type: array
          minItems: 1
          items:
            type: object
            required: [foodReferenceId, rawWeightGrams]
            properties:
              foodReferenceId: { type: string }
              ingredientName: { type: string }
              rawWeightGrams: { type: number, minimum: 0 }
              edibleRatio: { type: number, exclusiveMinimum: 0, maximum: 1 }
              retentionFactor: { type: number, exclusiveMinimum: 0, maximum: 1.5 }
    MealVisionMetrics:
      type: object
      required: [window, analysisCount, candidateCoverageRate, userCorrectionRate, latency, cost, confusionMatrix]
      properties:
        window: { type: object }
        analysisCount: { type: integer, minimum: 0 }
        candidateCoverageRate: { type: number, minimum: 0, maximum: 1 }
        averageCandidateCount: { type: number, minimum: 0 }
        feedbackCount: { type: integer, minimum: 0 }
        userCorrectionRate: { type: number, minimum: 0, maximum: 1 }
        unresolvedFeedbackCount: { type: integer, minimum: 0 }
        autoMatchedCount: { type: integer, minimum: 0 }
        latency: { type: object, description: Stored recognition latency with the 8000 ms P95 launch target. }
        cost: { type: object, description: Student vision AI calls, images and estimated provider cost. }
        confusionMatrix: { type: array, items: { type: object }, description: Top-candidate to user-confirmed dish and stall corrections. }
    AgentRequest:
      type: object
      description: Agent input. The assistant routes to dish_search, meal_recommendation, knowledge_qa, order_status, operations or general_canteen and executes only the tools required by the resolved intent.
      properties:
        question: { type: string }
        query: { type: string }
        profile: { type: object }
        profileOverride: { type: object, description: Temporary constraints for this request; they are not persisted to the health profile. }
        context: { type: object }
        options: { type: object }
        sessionId: { type: string }
    AiSettings:
      type: object
      properties:
        apiKey: { type: string, description: Full key accepted on write; reads return a mask only. On PUT, an empty value or the returned mask preserves the stored key; only DELETE clears it. }
        baseUrl: { type: string }
        embeddingModel: { type: string }
        chatModel: { type: string }
        visionModel: { type: string }
        timeoutMs: { type: integer }
    Tenant:
      type: object
      required: [id, name, status, plan, aiQuota, storageQuotaMb]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled], description: disabled 表示租户已暂停或停用。 }
        plan: { type: string }
        aiQuota: { type: integer, minimum: 0, description: 每月 AI 调用额度；0 表示不限额。 }
        storageQuotaMb: { type: integer, minimum: 0 }
        createdAt: { type: string }
        updatedAt: { type: string }
    TenantInput:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled], description: disabled 表示租户已暂停或停用。 }
        plan: { type: string }
        aiQuota: { type: integer, minimum: 0, description: 每月 AI 调用额度；0 表示不限额。 }
        storageQuotaMb: { type: integer, minimum: 0 }
    MenuItemInput:
      type: object
      required: [dishId]
      properties:
        dishId: { type: string }
        price: { type: number }
        supplyLimit: { type: integer }
        soldOut: { type: boolean }
    MenuInput:
      type: object
      required: [canteenId, date, mealType]
      properties:
        id: { type: string }
        canteenId: { type: string }
        date: { type: string, format: date }
        mealType: { type: string, enum: [breakfast, lunch, dinner, snack] }
        status: { type: string, enum: [draft, published, archived] }
        items:
          type: array
          items: { $ref: '#/components/schemas/MenuItemInput' }
    MenuItem:
      allOf:
        - $ref: '#/components/schemas/MenuItemInput'
        - type: object
          properties:
            id: { type: string }
            tenantId: { type: string }
            menuId: { type: string }
            dishName: { type: string }
            createdAt: { type: string }
            updatedAt: { type: string }
    Menu:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        canteenId: { type: string }
        canteenName: { type: string }
        date: { type: string, format: date }
        mealType: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        items:
          type: array
          items: { $ref: '#/components/schemas/MenuItem' }
        createdAt: { type: string }
        updatedAt: { type: string }
    MenuListResponse:
      type: object
      properties:
        menus:
          type: array
          items: { $ref: '#/components/schemas/Menu' }
        total: { type: integer }
    TodayMenuResponse:
      type: object
      properties:
        date: { type: string, format: date }
        mealType: { type: string }
        menus:
          type: array
          items: { $ref: '#/components/schemas/Menu' }
        dishes:
          type: array
          items: { type: object }
        source: { type: string, enum: [menu, fallback] }
    AiQuota:
      type: object
      properties:
        quota: { type: integer, description: Monthly successful AI call quota; 0 means unlimited. }
        used: { type: integer }
        remaining: { type: integer }
        period: { type: string, example: '2026-07' }
    AiUsageLog:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        userId: { type: string }
        feature: { type: string, enum: [meal-advisor, student-vision, admin-vision-import] }
        provider: { type: string }
        model: { type: string }
        status: { type: string, enum: [success, failure] }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        imageCount: { type: integer }
        estimatedCost: { type: number }
        latencyMs: { type: integer }
        error: { type: string }
        createdAt: { type: string }
    AiUsageResponse:
      type: object
      properties:
        logs:
          type: array
          items: { $ref: '#/components/schemas/AiUsageLog' }
        total: { type: integer }
        quota: { $ref: '#/components/schemas/AiQuota' }
        summary:
          type: array
          items: { type: object }
    MenuBatchRequest:
      type: object
      required: [action, ids]
      properties:
        action: { type: string, enum: [publish, archive] }
        ids:
          type: array
          items: { type: string }
    MenuBatchResponse:
      allOf:
        - $ref: '#/components/schemas/MenuListResponse'
        - type: object
          properties:
            updated: { type: integer }
    ContextualRecommendation:
      type: object
      description: Compatibility response used by GET /recommend. New clients should consume RecommendationResponse from POST /recommend. ranked and plan are derived from the same recommendations array.
      properties:
        ranked:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              contextualScore: { type: number }
              scoreBreakdown:
                type: object
                properties:
                  goal: { type: number }
                  rating: { type: number }
                  budget: { type: number }
                  weather: { type: number }
                  crowd: { type: number }
                  preference: { type: number }
                  nutritionFocus: { type: number }
                  spice: { type: number }
                  tags: { type: number }
                  timeBonus: { type: number }
              why:
                type: array
                items: { type: string }
        dishes:
          type: array
          description: Legacy alias of ranked.
          items: { $ref: '#/components/schemas/RecommendationItem' }
        totals: { type: object, description: Legacy alias of plan.totals. }
        plan: { type: object }
        context:
          type: object
          properties:
            environment: { type: object }
            timeOfDay: { type: string }
            profile: { type: object }
        source: { type: string }
        menu: { type: object }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/RecommendationItem' }
        mealPlan: { $ref: '#/components/schemas/MealPlan' }
        evidence: { $ref: '#/components/schemas/RetrievalEvidence' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/RetrievalWarning' }
        suggestedRelaxations:
          type: array
          items: { $ref: '#/components/schemas/SuggestedRelaxation' }
        meta: { $ref: '#/components/schemas/RetrievalMeta' }
    DishSearchFilters:
      type: object
      description: Structured hard filters. keyword/maxPrice are accepted compatibility aliases for query/budgetMax. Safety filters are never automatically relaxed.
      properties:
        keyword: { type: string }
        maxPrice: { type: number, minimum: 0 }
        budgetMin: { type: number, minimum: 0 }
        budgetMax: { type: number, minimum: 0 }
        mealType: { type: string, enum: [breakfast, lunch, dinner] }
        primaryCanteenId: { type: string }
        canteenId: { type: string }
        canteenName: { type: string }
        stallId: { type: string }
        stallName: { type: string }
        halalOnly: { type: boolean }
        taste: { type: string }
        tags: { type: array, items: { type: string } }
        includeIngredients: { type: array, items: { type: string } }
        avoidIngredients: { type: array, items: { type: string } }
        allergens: { type: array, items: { type: string } }
        dietaryPattern: { type: string, enum: [unrestricted, balanced, pescatarian, vegetarian, vegan] }
        minProtein: { type: number, minimum: 0 }
        minFiber: { type: number, minimum: 0 }
        maxCalories: { type: number, minimum: 0 }
        maxFat: { type: number, minimum: 0 }
        maxCarbs: { type: number, minimum: 0 }
        maxSodium: { type: number, minimum: 0 }
        maxSugar: { type: number, minimum: 0 }
        orderableOnly: { type: boolean }
    RetrievalContext:
      type: object
      properties:
        date: { type: string, format: date }
        time: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        mealType: { type: string, enum: [breakfast, lunch, dinner] }
        timeOfDay: { type: string, enum: [breakfast, lunch, dinner] }
        environment: { type: object }
        preferences: { type: array, items: { type: object } }
    DishSearchRequest:
      type: object
      properties:
        query: { type: string, maxLength: 500, description: Natural-language dish query. Rule extraction runs before optional semantic retrieval. }
        filters: { $ref: '#/components/schemas/DishSearchFilters' }
        sort: { type: string, enum: [relevance, price_asc, price_desc, rating, sales], default: relevance }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
        offset: { type: integer, minimum: 0, default: 0 }
        context: { $ref: '#/components/schemas/RetrievalContext' }
    DishPricing:
      type: object
      required: [mode, display, minAmount, maxAmount, budgetComparable]
      description: Structured catalog pricing. price remains the lowest purchasable amount for backward compatibility; per-weight prices are not sufficient to prove that a whole serving fits a budget.
      properties:
        mode: { type: string, enum: [fixed, per_weight, per_person, variants, tiered] }
        display: { type: string, examples: [12元, 1.68元/50克, 10-18元] }
        baseAmount: { type: number, minimum: 0 }
        baseQuantity: { type: number, minimum: 0, nullable: true }
        unit: { type: string }
        minAmount: { type: number, minimum: 0 }
        maxAmount: { type: number, minimum: 0 }
        budgetComparable: { type: boolean }
        variants:
          type: array
          items:
            type: object
            required: [id, label, amount]
            properties:
              id: { type: string }
              label: { type: string }
              amount: { type: number, minimum: 0 }
              quantity: { type: number, minimum: 0, nullable: true }
              unit: { type: string }
        modifiers:
          type: array
          items:
            type: object
            required: [label, amount]
            properties:
              label: { type: string }
              amount: { type: number, minimum: 0 }
        raw: { type: string, description: Original normalized pricing note retained for audit and display fallback. }
    DishAvailability:
      type: object
      required: [orderable, status, price]
      description: Live availability projected from published menus, menu items, stall state, supply counters and serving windows. It is SQL truth and is never generated by the LLM.
      properties:
        orderable: { type: boolean }
        status: { type: string, enum: [available, limited, sold_out, outside_serving_time, stall_closed, not_on_menu, catalog_only, dish_inactive, unavailable] }
        reason: { type: string, nullable: true }
        menuItemId: { type: string, nullable: true }
        menuId: { type: string, nullable: true }
        date: { type: string, format: date }
        mealType: { type: string }
        price: { type: number, minimum: 0 }
        priceDisplay: { type: string, description: Display-safe current price. Catalog-only records use the structured catalog price. }
        budgetComparable: { type: boolean, description: False for pricing such as per-weight where the final serving total is unknown. }
        supplyLimit: { type: integer, minimum: 0 }
        supplyCount: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0, nullable: true }
        servingStart: { type: string, nullable: true }
        servingEnd: { type: string, nullable: true }
    SafetyDeclaration:
      type: object
      required: [allergenCode, status, source, dataVersion]
      properties:
        allergenCode: { type: string, description: Canonical allergen code; '*' means the requested allergen has not been individually verified. }
        status: { type: string, enum: [confirmed_absent, confirmed_present, unknown, cross_contact_possible] }
        source: { type: string }
        verifiedBy: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        dataVersion: { type: string }
        requestedAllergen: { type: string, nullable: true }
    DishSafety:
      type: object
      required: [status, blocked, declarations, unknownAllergens, matchedAllergens]
      description: Safety is independent from retrieval confidence. Unknown never means confirmed absent.
      properties:
        status: { type: string, enum: [not_applicable, blocked, unknown, confirmed_absent] }
        blocked: { type: boolean }
        declarations: { type: array, items: { $ref: '#/components/schemas/SafetyDeclaration' } }
        unknownAllergens: { type: array, items: { type: string } }
        matchedAllergens: { type: array, items: { type: string } }
    DishDataQuality:
      type: object
      required: [completeness, freshness, checks, source, dataVersion, synthetic]
      properties:
        completeness: { type: number, minimum: 0, maximum: 1 }
        freshness: { type: number, minimum: 0, maximum: 1 }
        checks: { type: object, additionalProperties: { type: boolean } }
        source: { type: string }
        verifiedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        dataVersion: { type: string }
        synthetic: { type: boolean, description: Synthetic records are local-test only and are rejected in production mode. }
    RetrievalConfidence:
      type: object
      required: [level, score, factors, calibrated, note]
      description: Composite retrieval and data-quality signal; it is not raw cosine similarity and is not a medical safety probability.
      properties:
        level: { type: string, enum: [high, medium, low] }
        score: { type: number, minimum: 0, maximum: 1 }
        factors:
          type: object
          properties:
            channelAgreement: { type: number, minimum: 0, maximum: 1 }
            semanticSupport: { type: number, minimum: 0, maximum: 1 }
            rankSeparation: { type: number, minimum: 0, maximum: 1 }
            factCompleteness: { type: number, minimum: 0, maximum: 1 }
            sourceQuality: { type: number, minimum: 0, maximum: 1 }
            freshness: { type: number, minimum: 0, maximum: 1 }
        calibrated: { type: boolean }
        note: { type: string }
    DishSearchItem:
      type: object
      required: [id, name, price, availability, matchReasons, retrievalScore]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        pricingMode: { type: string, enum: [fixed, per_weight, per_person, variants, tiered] }
        priceDisplay: { type: string }
        pricing: { $ref: '#/components/schemas/DishPricing' }
        aliases: { type: array, items: { type: string }, description: Reviewed search aliases; not independent sale items. }
        semanticLabels: { type: array, items: { type: string }, description: Soft retrieval expansion only; never proves recipe, nutrition or safety facts. }
        sourceRef: { type: object, additionalProperties: true, description: Import batch and source locator used for audit traceability. }
        stallId: { type: string, nullable: true }
        stallName: { type: string, nullable: true }
        canteenId: { type: string, nullable: true }
        canteenName: { type: string, nullable: true }
        canteenLocation: { type: string, nullable: true }
        taste: { type: string }
        cuisine: { type: string }
        regionalTaste: { type: string, description: Optional display classification used by regional recommendations. }
        ingredients: { type: array, items: { type: string } }
        allergens: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        halal: { type: boolean }
        mealTypes: { type: array, items: { type: string } }
        nutrition: { type: object, description: Values are displayable only when factStatus.nutrition is estimated or verified. Unknown placeholder zeros are not nutrition facts. }
        factStatus: { type: object, additionalProperties: { type: string, enum: [unknown, estimated, verified] } }
        rating: { type: number, description: Zero with reviewCount=0 means no rating exists and clients must display 暂无评分. }
        reviewCount: { type: integer, minimum: 0 }
        availability: { $ref: '#/components/schemas/DishAvailability' }
        safety: { $ref: '#/components/schemas/DishSafety' }
        dataQuality: { $ref: '#/components/schemas/DishDataQuality' }
        confidence: { $ref: '#/components/schemas/RetrievalConfidence' }
        matchReasons: { type: array, items: { type: string } }
        retrievalScore: { type: number }
        retrievalBreakdown: { type: object, additionalProperties: { type: number }, description: Internal channel contributions; clients should display confidence instead of these raw values. }
    SuggestedRelaxation:
      type: object
      required: [filter, message]
      properties:
        filter: { type: string }
        message: { type: string }
    RetrievalWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [ALLERGEN_UNVERIFIED, PROFILE_INCOMPLETE, QUERY_REQUIREMENT_CONFLICT, NO_ORDERABLE_MENU, RETRIEVAL_DEGRADED, NO_COMBINATION_WITHIN_BUDGET] }
        message: { type: string }
        dishId: { type: string, nullable: true }
        allergens: { type: array, items: { type: string } }
        requiresConfirmation: { type: boolean }
    RetrievalCitation:
      type: object
      required: [sourceId, sourceType, title]
      properties:
        id: { type: string }
        sourceId: { type: string }
        sourceType: { type: string, enum: [dish, health_knowledge, health, knowledge] }
        title: { type: string }
        name: { type: string, description: Compatibility alias of title. }
        content: { type: string, description: Compatibility full-text evidence. }
        snippet: { type: string }
        score: { type: number }
        metadata: { type: object }
    RetrievalEvidence:
      type: object
      required: [dishes, knowledge]
      description: Dish facts and health knowledge are deliberately separated so knowledge chunks cannot be returned as dish search results.
      properties:
        dishes:
          type: array
          items: { $ref: '#/components/schemas/RetrievalCitation' }
        knowledge:
          type: array
          items: { $ref: '#/components/schemas/RetrievalCitation' }
    RetrievalMeta:
      type: object
      properties:
        tenantId: { type: string }
        mode: { type: string, enum: [alternatives, combination] }
        source: { type: string, enum: [menu, catalog_fallback] }
        orderable: { type: boolean }
        semanticUsed: { type: boolean }
        quotaExhausted: { type: boolean, description: True when remote semantic calls were skipped and rules/lexical retrieval were used. }
        degradedReasons: { type: array, items: { type: string } }
        retrieval: { type: array, items: { type: string, enum: [exact, lexical, semantic, baseline] } }
        sourceCandidateCount: { type: integer }
        filteredCandidateCount: { type: integer }
        eligibleCandidateCount: { type: integer }
        date: { type: string, format: date }
        mealType: { type: string }
        indexVersion: { type: string, nullable: true }
        profile: { type: object }
        interpreted: { type: object }
    DishSearchResponse:
      type: object
      required: [interpreted, items, availability, matchReasons, suggestedRelaxations, page, meta]
      properties:
        interpreted: { type: object }
        confidence: { $ref: '#/components/schemas/RetrievalConfidence' }
        warnings: { type: array, items: { $ref: '#/components/schemas/RetrievalWarning' } }
        items:
          type: array
          items: { $ref: '#/components/schemas/DishSearchItem' }
        availability:
          type: object
          properties:
            orderableCount: { type: integer }
            totalCount: { type: integer }
            date: { type: string, format: date }
            mealType: { type: string }
            asOf: { type: string }
        matchReasons:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        suggestedRelaxations:
          type: array
          items: { $ref: '#/components/schemas/SuggestedRelaxation' }
        page:
          type: object
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/RetrievalMeta' }
    RecommendationRequest:
      type: object
      properties:
        query: { type: string, maxLength: 500 }
        context: { $ref: '#/components/schemas/RetrievalContext' }
        profileOverride: { type: object, description: Request-scoped profile changes that are not persisted. }
        options:
          type: object
          properties:
            mode: { type: string, enum: [alternatives, combination], description: Defaults to alternatives; combination is also inferred from explicit meal-combination wording. }
            limit: { type: integer, minimum: 1, maximum: 10, default: 3 }
            combinationSize: { type: integer, minimum: 2, maximum: 3, default: 3 }
            requireOrderable: { type: boolean, default: true }
            strictTaste: { type: boolean, default: false }
    RecommendationItem:
      allOf:
        - $ref: '#/components/schemas/DishSearchItem'
        - type: object
          required: [recommendationScore, scoreBreakdown, why]
          properties:
            recommendationScore: { type: number }
            scoreBreakdown:
              type: object
              additionalProperties: { type: number }
            why: { type: array, items: { type: string } }
    MealPlan:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [alternatives, combination] }
        budgetMax: { type: number }
        options:
          type: array
          items:
            type: object
            properties:
              dishId: { type: string }
              name: { type: string }
              price: { type: number }
              orderable: { type: boolean }
        dishes:
          type: array
          items: { $ref: '#/components/schemas/RecommendationItem' }
        totals: { type: object }
    RecommendationResponse:
      type: object
      required: [recommendations, mealPlan, evidence, warnings, suggestedRelaxations, meta]
      description: Personalized recommendation response. Default recommendations are independent alternatives, each within budget. A multi-dish mealPlan is produced only in combination mode and its total price must remain within budget.
      properties:
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/RecommendationItem' }
        mealPlan: { $ref: '#/components/schemas/MealPlan' }
        confidence: { $ref: '#/components/schemas/RetrievalConfidence' }
        evidence: { $ref: '#/components/schemas/RetrievalEvidence' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/RetrievalWarning' }
        suggestedRelaxations:
          type: array
          items: { $ref: '#/components/schemas/SuggestedRelaxation' }
        meta: { $ref: '#/components/schemas/RetrievalMeta' }
    AgentIntent:
      type: string
      enum: [dish_search, meal_recommendation, knowledge_qa, order_status, operations, general_canteen]
    AgentToolName:
      type: string
      enum: [session.load, memory.long_term, profile.load, menu.today, dish.search, meal.recommend, knowledge.search, rag.meal_advisor, orders.mine, orders.analytics, order.create.propose, session.save]
    AgentWorkflowResponse:
      type: object
      properties:
        sessionId: { type: string }
        answer: { type: string }
        intent: { $ref: '#/components/schemas/AgentIntent' }
        steps:
          type: array
          description: Only tools actually executed during this run are listed.
          items:
            type: object
            properties:
              tool: { $ref: '#/components/schemas/AgentToolName' }
              status: { type: string }
              latencyMs: { type: number }
        citations:
          type: array
          items: { $ref: '#/components/schemas/RetrievalCitation' }
        evidence: { $ref: '#/components/schemas/RetrievalEvidence' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/RecommendationItem' }
        search: { $ref: '#/components/schemas/DishSearchResponse' }
        mealPlan: { $ref: '#/components/schemas/MealPlan' }
        actions: { type: array, items: { type: object }, description: High-risk order actions require explicit confirmation and can only use explicitly named, currently orderable dishes. }
        plan: { type: object }
        summary: { type: object }
    RetrievalIndexStatus:
      type: object
      properties:
        tenantId: { type: string }
        driver: { type: string, enum: [postgres, sqlite] }
        ready: { type: boolean }
        mode: { type: string, enum: [hybrid, lexical_fallback] }
        indexVersion: { type: string }
        embeddingDimension: { type: integer, minimum: 1, examples: [1024, 1536], description: Local experimental indexes may use 1024 dimensions; the production PostgreSQL contract remains 1536 until an explicit migration. }
        documentCount: { type: integer }
        embeddedCount: { type: integer }
        sourceCounts: { type: array, items: { type: object } }
        lastIndexedAt: { type: string, nullable: true }
        failureCount: { type: integer }
        latestRun: { type: object, nullable: true }
        details: { type: object, description: PostgreSQL extension/index readiness details when ready=false. }
    RetrievalReindexRequest:
      type: object
      properties:
        sourceTypes:
          type: array
          items: { type: string, enum: [dish, health_knowledge] }
        prune: { type: boolean, default: true }
    RetrievalReindexResponse:
      type: object
      properties:
        runId: { type: string }
        tenantId: { type: string }
        sourceTypes: { type: array, items: { type: string } }
        documentCount: { type: integer }
        indexedCount: { type: integer }
        skippedCount: { type: integer }
        embeddedCount: { type: integer }
        prunedCount: { type: integer }
        failureCount: { type: integer }
        failures: { type: array, items: { type: object } }
        embeddingModel: { type: string }
        quotaExhausted: { type: boolean, description: When true, the run still refreshes lexical data but skips new remote embeddings. }
    DishPreference:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        userId: { type: string }
        dishId: { type: string }
        favorite: { type: boolean }
        eatenCount: { type: integer }
        drawnCount: { type: integer }
        lastEatenAt: { type: string }
        lastDrawnAt: { type: string }
    CampusEnvironment:
      type: object
      properties:
        temperature: { type: number, description: 'Temperature in Celsius, -40 to 55' }
        weatherLabel: { type: string, description: 'Weather description, e.g. 晴, 阴, 雨' }
        updatedAt: { type: string }
    StallInput:
      type: object
      required: [canteenId, name, floor, category]
      properties:
        id: { type: string }
        canteenId: { type: string }
        parentId: { type: string, nullable: true, description: 'POST accepts only null. PUT may retain the current value for historical records or set null to migrate the stall directly under a dining area.' }
        name: { type: string }
        floor: { type: string }
        category: { type: string }
        rating: { type: number }
        avgPrice: { type: number }
        open: { type: boolean }
        description: { type: string }
    AdminSavedResponse:
      type: object
      required: [savedId]
      properties:
        savedId: { type: string }
        savedEntity: { type: object, nullable: true, description: 'Returned for dish writes.' }
    DishInput:
      type: object
      required: [stallId, name, price, taste, cuisine, ingredients, tags, nutrition]
      properties:
        id: { type: string }
        stallId: { type: string }
        name: { type: string }
        price: { type: number, minimum: 0 }
        pricingMode: { type: string, enum: [fixed, per_weight, per_person, variants, tiered], default: fixed }
        priceDisplay: { type: string, description: Human-readable normalized price, for example 1.68元/50克. }
        pricing: { $ref: '#/components/schemas/DishPricing' }
        taste: { type: string }
        cuisine: { type: string }
        regionalTaste: { type: string }
        ingredients: { type: array, items: { type: string } }
        seasonings: { type: array, items: { type: string } }
        additives: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        aliases: { type: array, items: { type: string } }
        semanticLabels: { type: array, items: { type: string }, description: Soft retrieval labels only; they do not establish recipe or safety facts. }
        sourceRef: { type: object, additionalProperties: true, description: Immutable source trace for controlled imports. }
        allergens: { type: array, items: { type: string } }
        safetyDeclarations: { type: array, items: { $ref: '#/components/schemas/SafetyDeclaration' } }
        dietaryLabels:
          type: array
          description: Structured dietary labels used as hard recommendation filters; labels are not inferred from names or ingredients.
          items: { type: string, enum: [pescatarian, vegetarian, vegan] }
        halal: { type: boolean }
        mealTypes: { type: array, items: { type: string } }
        nutrition: { type: object }
        nutritionFactStatus: { type: string, enum: [unknown, estimated, verified] }
        recipeFactStatus: { type: string, enum: [unknown, estimated, verified] }
        halalFactStatus: { type: string, enum: [unknown, estimated, verified] }
        dietaryFactStatus: { type: string, enum: [unknown, estimated, verified] }
        spiceLevel: { type: integer, minimum: 0, maximum: 5, nullable: true }
        spiceFactStatus: { type: string, enum: [unknown, estimated, verified] }
        factSource: { type: string }
        factVerifiedAt: { type: string, format: date-time, nullable: true }
        factExpiresAt: { type: string, format: date-time, nullable: true }
        dataVersion: { type: string }
        synthetic: { type: boolean, readOnly: true, description: Local simulation records only; production API writes reject synthetic=true. }
        imageUrl: { type: string, nullable: true }
        description: { type: string }
    ReviewStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, pending, rejected] }
    HealthProfile:
      type: object
      required: [budgetMax, allergyStatus]
      properties:
        goal: { type: string, enum: [healthy, fatLoss, muscleGain, maintain] }
        budgetMax: { type: number, minimum: 8, maximum: 200 }
        mealType: { type: string, enum: [breakfast, lunch, dinner] }
        taste: { type: string }
        halalOnly: { type: boolean }
        avoid: { type: array, items: { type: string }, description: Non-allergy ingredients the user chooses to avoid. Never automatically relaxed. }
        allergies: { type: array, items: { type: string }, description: Declared allergens matched against dish ingredients and allergens_json. Never automatically relaxed. }
        allergyStatus: { type: string, enum: [unknown, none, declared] }
        onboardingStatus: { type: string, enum: [pending, deferred, completed], readOnly: true }
        dietaryPattern: { type: string, enum: [unrestricted, pescatarian, vegetarian, vegan] }
        spiceLevel: { type: integer, minimum: 0, maximum: 5 }
        nutritionFocus:
          type: array
          items: { type: string, enum: [highProtein, lowFat, lowCarb, highFiber, lowSodium, lowSugar] }
        preferLowCrowd: { type: boolean }
        favoriteTags: { type: array, items: { type: string } }
    HealthOnboardingUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [deferred] }
    ReviewInput:
      type: object
      required: [targetType, targetId, rating, content]
      properties:
        targetType: { type: string, enum: [dish, canteen] }
        targetId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, minLength: 2, maxLength: 600 }
    CampusPostInput:
      type: object
      required: [targetType, targetId, content]
      properties:
        targetType: { type: string, enum: [dish, canteen] }
        targetId: { type: string }
        content: { type: string, minLength: 2, maxLength: 600 }
        imageUrl: { type: string, format: uri, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true, description: Only allowed when targetType is dish. }
    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewInput'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [pending, approved, rejected] }
            author: { type: object }
            dish: { type: object, nullable: true }
            stall: { type: object, nullable: true }
            canteen: { type: object, nullable: true }
            createdAt: { type: string }
    CampusPost:
      allOf:
        - $ref: '#/components/schemas/CampusPostInput'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [pending, approved, rejected] }
            linkedReviewId: { type: string, nullable: true }
            isOwn: { type: boolean }
            author: { type: object }
            createdAt: { type: string }
            updatedAt: { type: string }
paths:
  /health:
    get:
      security: []
      responses: { '200': { description: OK; X-Request-Id is echoed in headers } }
  /health/live:
    get:
      security: []
      description: Liveness probe. It does not depend on PostgreSQL or Redis.
      responses: { '200': { description: Process is alive } }
  /health/ready:
    get:
      security: []
      description: Readiness probe. PostgreSQL must be available; Redis must also be distributed and available when REDIS_REQUIRED=1.
      responses:
        '200': { description: Service can receive traffic, content: { application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } } } }
        '503': { description: A required dependency is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } } } }
  /internal/metrics:
    get:
      security:
        - internalMetricsToken: []
        - bearerAuth: []
      description: Internal runtime snapshot. Accepts X-Internal-Token or an authenticated account with audit:read.
      responses:
        '200': { description: Runtime, HTTP, pool, cache and Outbox metrics, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeMetrics' } } } }
        '401': { description: Login required when no valid internal token is supplied }
        '403': { description: audit:read permission required }
  /bootstrap:
    get:
      security: []
      responses: { '200': { description: Full app state including dishPreferences } }
  /recommend:
    get:
      security: []
      deprecated: false
      description: Backward-compatible deterministic recommendation endpoint. Internally executes the same hard-constraint and unified-ranking workflow as POST /recommend, then adds legacy ranked, plan, context, source and menu fields. New clients should use POST /recommend.
      parameters:
        - { name: mealType, in: query, schema: { type: string, enum: [breakfast, lunch, dinner] } }
      responses:
        '200': { description: Ranked dishes with context, content: { application/json: { schema: { $ref: '#/components/schemas/ContextualRecommendation' } } } }
    post:
      security: []
      description: Personalized recommendation workflow. Loads the authenticated user's profile and preferences when available, merges request-scoped overrides, applies allergen, dietary, halal, meal, budget and live availability constraints before ranking, and keeps dish evidence separate from health knowledge. If no orderable menu candidate exists, catalog references are returned with orderable=false and an explicit warning.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200': { description: Personalized alternatives or a budget-constrained combination, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationResponse' } } } }
        '400': { description: Invalid recommendation request, profile override or budget range, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/verification-codes:
    post:
      security: []
      description: Issues a five-minute student verification code. Resends are blocked for 60 seconds, phone and IP are limited to five sends per hour, and production returns SMS_PROVIDER_NOT_CONFIGURED until a provider is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationCodeRequest' }
      responses:
        '202': { description: Verification code accepted for delivery; plaintext codes are returned only in the test environment. }
        '429': { description: Resend or hourly rate limit reached, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: SMS provider is not configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/login:
    post:
      security: []
      description: Unified login for student phone numbers and legacy admin/student usernames.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Rotating session and app state, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSessionResponse' } } } }
        '401': { description: Invalid credentials }
  /auth/register:
    post:
      security: []
      description: Creates a phone-verified student after consuming a one-time registration code and recording agreement consent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Rotating session and app state for new student, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSessionResponse' } } } }
        '400': { description: Invalid phone, code, password or agreement consent }
        '409': { description: Phone number already registered }
  /auth/wechat-login:
    post:
      security: []
      description: Logs in by WeChat code. New users must also provide a getPhoneNumber phoneCode and agreement version. Existing phone accounts are bound instead of duplicated; conflicting bindings return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WechatLoginRequest' }
      responses:
        '200': { description: Rotating session, public user, app state and isNewUser flag, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSessionResponse' } } } }
        '401': { description: Invalid WeChat login or phone authorization code }
        '409': { description: Phone and WeChat identities are bound to different users }
        '503': { description: WeChat miniapp credentials are not configured }
  /auth/password/reset:
    post:
      security: []
      description: Resets a student password after consuming a one-time code and increments token_version so all previous JWTs become invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '200': { description: Password reset completed }
        '400': { description: Invalid or expired code or weak password }
        '404': { description: Phone number is not registered }
  /auth/refresh:
    post:
      security: []
      description: Atomically consumes the current Refresh Token and returns a new Access/Refresh pair. Reuse of a rotated token revokes the entire session family.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { description: Rotated session tokens, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSessionResponse' } } } }
        '401': { description: Invalid, expired, revoked or replayed Refresh Token }
  /auth/logout:
    post:
      security: []
      description: Revokes one session using the Access Token session id or a Refresh Token supplied in the body.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200': { description: Session revoked or already absent }
  /auth/logout-all:
    post:
      description: Revokes all active sessions and Refresh Tokens for the authenticated user.
      responses:
        '200': { description: All device sessions revoked }
        '401': { description: Login required }
  /canteens:
    get:
      security: []
      responses: { '200': { description: Tenant-scoped canteen list } }
  /stalls:
    get:
      security: []
      responses: { '200': { description: Tenant-scoped stall list } }
  /dishes:
    get:
      security: []
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: taste, in: query, schema: { type: string } }
        - { name: halalOnly, in: query, schema: { type: boolean } }
      responses: { '200': { description: Tenant-scoped dish list } }
  /dishes/search:
    post:
      security: []
      description: Natural-language and structured dish search. Runs exact field matching, Chinese lexical retrieval and optional pgvector semantic retrieval, fuses rankings with RRF, then attaches current SQL-backed menu price, supply, serving-window and orderability facts. Semantic retrieval never overrides tenant, allergen, price, inventory or permission constraints, and only dish documents may become search items.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishSearchRequest' }
      responses:
        '200': { description: Ranked real dishes with live availability and explainable match reasons, content: { application/json: { schema: { $ref: '#/components/schemas/DishSearchResponse' } } } }
        '400': { description: Invalid query, filter, pagination or budget range, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /dishes/{id}:
    get:
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Dish detail with stall, canteen and reviews }
        '404': { description: Dish not found }
  /rankings:
    get:
      security: []
      responses: { '200': { description: Cached rankings } }
  /menus/today:
    get:
      security: []
      description: Returns today's published menu dishes for the requested meal type, including sold-out items with their supply status; falls back to dish library when no menu exists.
      parameters:
        - { name: mealType, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Today menu bundle, content: { application/json: { schema: { $ref: '#/components/schemas/TodayMenuResponse' } } } }
  /rag/search:
    get:
      security: []
      description: Compatibility endpoint for the dish-search workflow. It returns the complete DishSearchResponse and a legacy results array containing only dish citations. Health knowledge documents are never surfaced as dish results.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 8 } }
      responses:
        '200':
          description: Dish search response plus compatibility citation results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DishSearchResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/RetrievalCitation' }
        '400': { description: Missing query }
  /agent/meal-advisor:
    post:
      security: []
      description: Compatibility meal-advisor endpoint backed by the new recommendation workflow. Returns new recommendation fields plus legacy ranked/plan/context fields, a deterministic grounded answer and a dish-only legacy citations list; grouped dish and health evidence remains available under evidence. LLM or RAG text may explain results but cannot alter SQL-backed price, inventory, sold-out, serving-window, allergen or tenant facts. Exhausted AI quota degrades to rules and lexical retrieval instead of blocking the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRequest' }
      responses:
        '200':
          description: Compatibility advisor answer and recommendation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ContextualRecommendation'
                  - type: object
                    properties:
                      answer: { type: string }
                      answerSource: { type: string, enum: [hybrid_retrieval, deterministic] }
                      citations:
                        type: array
                        items: { $ref: '#/components/schemas/RetrievalCitation' }
  /agent/assistant:
    post:
      description: Intent-routed canteen Agent. Supported intents are dish_search, meal_recommendation, knowledge_qa, order_status, operations and general_canteen. New retrieval tools are dish.search, meal.recommend and knowledge.search. Order queries execute only orders.mine, operations queries execute only authorized analytics tools, and high-risk order creation remains confirmation-gated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRequest' }
      responses:
        '200': { description: Agent result whose steps list contains only tools actually executed, content: { application/json: { schema: { $ref: '#/components/schemas/AgentWorkflowResponse' } } } }
        '401': { description: Login required }
        '403': { description: agent:use permission required }
        '429': { description: AI monthly quota exhausted }
  /reviews:
    get:
      description: List approved reviews with dish, stall and canteen metadata. Requires login.
      parameters:
        - { name: targetType, in: query, schema: { type: string, enum: [dish, canteen] } }
        - { name: canteenId, in: query, schema: { type: string } }
        - { name: stallId, in: query, schema: { type: string } }
        - { name: dishId, in: query, schema: { type: string } }
        - { name: q, in: query, description: Keyword matched against review text and author/dish/stall/canteen names, schema: { type: string, maxLength: 80 } }
        - { name: sort, in: query, schema: { type: string, enum: [rating_desc, rating_asc, latest], default: rating_desc } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 30 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Approved review page and summary }
        '401': { description: Login required }
    post:
      description: Requires review:create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201': { description: Updated dish detail }
        '400': { description: Invalid target, rating or content }
        '401': { description: Login required }
  /posts:
    get:
      description: List approved campus posts plus the current user's own moderation states. Requires login.
      parameters:
        - { name: targetType, in: query, schema: { type: string, enum: [dish, canteen] } }
        - { name: canteenId, in: query, schema: { type: string } }
        - { name: dishId, in: query, schema: { type: string } }
        - { name: q, in: query, description: Keyword matched against post text and author/dish/stall/canteen names, schema: { type: string, maxLength: 80 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 30 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { '200': { description: Campus post page }, '401': { description: Login required } }
    post:
      description: Create a text post with an optional owned upload and optional dish rating. Requires post:create; all new posts are pending.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampusPostInput' }
      responses: { '201': { description: Pending campus post }, '400': { description: Invalid target, content, rating or image }, '401': { description: Login required } }
  /health/profile:
    put:
      description: Requires profile:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthProfile' }
      responses: { '200': { description: Updated profile and recommendation } }
  /health/profile/onboarding:
    patch:
      description: Changes a pending first-login health-profile prompt to deferred. Completed profiles cannot be downgraded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthOnboardingUpdate' }
      responses:
        '200': { description: Updated profile and app state }
        '400': { description: Only the deferred transition is accepted }
        '401': { description: Login required }
  /admin/reviews/{id}:
    delete:
      description: Delete a review and refresh its dish review count. Requires review:moderate.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Review deleted }, '404': { description: Review not found } }
  /uploads:
    post:
      description: Store a private image upload. Requires upload:create; anonymous uploads are rejected and owner_id is recorded. Storage keys are owner-scoped as tenant_id/user_id/upload-uuid.ext. Set S3_BUCKET to route uploads to a private S3/MinIO bucket; otherwise UPLOAD_DIR is used.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201': { description: Upload metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '401': { description: Login required }
  /uploads/{id}/content:
    get:
      security:
        - bearerAuth: []
        - {}
      description: Reads private upload bytes. Access requires an owner/moderator bearer token or an unexpired URL signature generated by the API.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: expires, in: query, required: false, schema: { type: integer } }
        - { name: signature, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Original image bytes }
        '403': { description: Upload access denied or signed URL invalid }
        '404': { description: Upload not found }
  /vision/meal-analyze:
    post:
      description: Trustworthy single-dish analysis. Requires agent:use and configured vision AI. Exact candidates are restricted by tenant, canteen/stall context and published menu; location is always relational database truth. Raw user images are not retained.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MealVisionRequest' }
      responses:
        '200': { description: Observation, up to three confirmation candidates and provenance-safe nutrition, content: { application/json: { schema: { $ref: '#/components/schemas/MealVisionResponse' } } } }
        '401': { description: Login required }
        '429': { description: AI monthly quota exhausted }
  /vision/analyses/{id}/confirm:
    post:
      description: Confirm, correct or reject a meal vision result. dishId must remain inside the original canteen and published-menu scope; trusted nutrition is resolved only after confirmation.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dishId: { type: string, nullable: true }
                portion: { type: object }
      responses:
        '200': { description: Confirmed dish and provenance-safe nutrition }
        '400': { description: Selected dish is outside the analysis scope }
        '404': { description: Analysis not found or not owned by the user }
  /admin/canteens:
    post:
      description: Create a dining venue or dining area. Requires canteen:write. A dining area parentId must reference one of the four tenant-owned top-level venues; third-level dining areas are rejected. Existing non-catalog top-level canteen creation remains backward compatible.
      responses:
        '201': { description: Full state plus savedId, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSavedResponse' } } } }
        '400': { description: Invalid hierarchy; stable codes include CANTEEN_FIXED_PARENT_FORBIDDEN, CANTEEN_PARENT_SELF, CANTEEN_PARENT_NOT_FOUND and CANTEEN_PARENT_NESTED }
        '409': { description: The requested id belongs to another tenant }
  /admin/canteens/{id}:
    put:
      description: Edit a dining venue or dining area. Requires canteen:write. Fixed venues cannot have a parent; existing dining areas cannot explicitly clear parentId and may move only to another valid fixed venue. Omitting parentId preserves the current parent.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Full state plus savedId, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSavedResponse' } } } }
        '400': { description: Invalid hierarchy; stable codes include CANTEEN_FIXED_PARENT_FORBIDDEN, CANTEEN_AREA_PARENT_REQUIRED, CANTEEN_PARENT_SELF, CANTEEN_PARENT_NOT_FOUND and CANTEEN_PARENT_NESTED }
        '409': { description: The requested id belongs to another tenant }
    delete:
      description: Delete canteen. Requires canteen:delete. A fixed venue containing dining areas must be emptied or migrated first.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Full state }
        '409': { description: Fixed venue still contains dining areas; code CANTEEN_HAS_AREAS }
  /admin/dishes:
    post:
      description: Create dish. Requires dish:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishInput' }
      responses:
        '201': { description: Full state plus savedId and savedEntity, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSavedResponse' } } } }
        '409': { description: The requested dish id belongs to another tenant }
  /admin/dishes/import:
    post:
      description: Bulk import dishes. Requires dish:bulk_import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dishes]
              properties:
                dishes: { type: array, items: { $ref: '#/components/schemas/DishInput' } }
      responses: { '200': { description: Import summary and full state } }
  /admin/dishes/vision-import:
    post:
      description: Admin vision prefill. Requires dish:write and configured vision AI; does not save to DB automatically. Successful calls count against monthly tenant quota.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '200': { description: Safe dish suggestion for manual confirmation }
        '429': { description: AI monthly quota exhausted }
  /admin/dishes/{id}/reference-images:
    get:
      description: List dish reference and held-out evaluation images. Requires dish:write.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Reference image list } }
    post:
      description: Bind a tenant-owned upload to a dish as a pending/approved reference image or held-out evaluation image. Evaluation images are never embedded.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DishReferenceImageInput' } } } }
      responses: { '201': { description: Created reference image } }
  /admin/dishes/{id}/recipes:
    get:
      description: List versioned dish recipes and calculated nutrition. Requires dish:write.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Recipe versions } }
    post:
      description: Create a recipe version from governed food-composition references. Approved recipes publish estimated nutrient ranges; AI annotations are not promoted automatically.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DishRecipeInput' } } } }
      responses: { '201': { description: Recipe calculation and version ids } }
  /admin/vision/reference-images/{id}:
    put:
      description: Review or reclassify a reference image. Requires dish:write.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated reference image } }
    delete:
      description: Delete a reference image binding and its embedding. The underlying upload retention policy is unchanged.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Deleted } }
  /admin/vision/reindex:
    post:
      description: Generate SigLIP embeddings for approved reference images only. Held-out evaluation images are excluded.
      responses:
        '200': { description: Reindex summary }
        '400': { description: VISION_EMBEDDING_BASE_URL is not configured }
  /admin/vision/metrics:
    get:
      description: Tenant-scoped meal vision monitoring for candidate coverage, P95 latency, correction rate, estimated model cost and dish/stall confusion. Requires ai:configure.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200': { description: Meal vision metrics, content: { application/json: { schema: { $ref: '#/components/schemas/MealVisionMetrics' } } } }
        '403': { description: AI monitoring permission required }
  /admin/dishes/{id}:
    put:
      description: Edit dish. Requires dish:write.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishInput' }
      responses: { '200': { description: Full state plus savedId and savedEntity, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSavedResponse' } } } } }
    delete:
      description: Soft-delete dish. Requires dish:delete.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Full state } }
  /admin/tenants:
    get:
      description: List tenants. Requires tenant:manage.
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items: { $ref: '#/components/schemas/Tenant' }
    post:
      description: Create or upsert tenant. Requires tenant:manage.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantInput' }
      responses: { '201': { description: Updated tenant list } }
  /admin/tenants/{id}:
    put:
      description: Update tenant. Requires tenant:manage.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantInput' }
      responses:
        '200': { description: Updated tenant list }
        '404': { description: Tenant not found }
  /admin/menus:
    get:
      description: List tenant-scoped menus. Requires dish:write. Supports date, mealType, status, limit and offset query filters.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: mealType, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, archived] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: Menu list with total, content: { application/json: { schema: { $ref: '#/components/schemas/MenuListResponse' } } } } }
    post:
      description: Create or upsert a tenant-scoped menu transactionally. Requires dish:write. canteenId and dishId values must belong to the current tenant.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '201': { description: Updated menu list }
        '400': { description: Invalid tenant ownership for canteen or dish }
  /admin/menus/{id}:
    put:
      description: Update menu and replace supplied menu items. Requires dish:write.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '200': { description: Updated menu list }
        '404': { description: Menu not found }
    delete:
      description: Archive menu by setting status=archived. Requires dish:write.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Updated menu list }
        '404': { description: Menu not found }
  /admin/menus/batch:
    post:
      description: Batch publish or archive tenant-scoped menus. Requires dish:write.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuBatchRequest' }
      responses:
        '200': { description: Updated count and menu list, content: { application/json: { schema: { $ref: '#/components/schemas/MenuBatchResponse' } } } }
        '400': { description: Invalid action or empty ids }
  /admin/catalog/tree:
    get:
      description: >-
        Tenant-scoped hierarchical catalog read for the administrator catalog workspace.
        Requires any one of audit:read, canteen:write, stall:write or dish:write. The response always preserves the four fixed region order;
        missing regions are returned with missing=true. Search keeps matching parent paths.
        venueId/areaId are aliases for regionId/canteenId. Stall and dish fields use
        camelCase, including parentId.
      parameters:
        - { name: regionId, in: query, schema: { type: string, enum: [campus-main, north-zone, south-zone, east-zone] } }
        - { name: venueId, in: query, schema: { type: string, enum: [campus-main, north-zone, south-zone, east-zone] }, description: Alias for regionId used by the four-venue workspace. }
        - { name: canteenId, in: query, schema: { type: string } }
        - { name: areaId, in: query, schema: { type: string }, description: Alias for canteenId used by the unified dining-area terminology. }
        - { name: stallId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Name/category search; matching ancestors remain in the path. }
        - { name: include, in: query, schema: { type: string, enum: [summary, dishes], default: summary } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Fixed-region catalog tree with counts and optional dishes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCatalogTreeResponse' }
        '403': { description: Missing every supported catalog-read capability or tenant access }
        '500':
          description: Server error with request correlation id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/users:
    get:
      description: Requires user:read.
      responses: { '200': { description: User list } }
  /admin/users/{id}:
    put:
      description: Requires user:write; role must be one of student, operator, stall_admin, canteen_admin, auditor, finance, tenant_admin, admin.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated user } }
  /admin/audit-logs:
    get:
      description: Requires audit:read. Each log exposes parsed metadata, including structured moderation state transitions when applicable.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { '200': { description: Paginated audit logs with structured metadata } }
  /admin/ai-settings:
    get:
      description: Requires ai:configure; API key is masked.
      responses: { '200': { description: Safe settings and provider status } }
    put:
      description: Requires ai:configure; stores OpenAI-compatible AI settings server-side. Leaving apiKey empty preserves the existing key.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSettings' }
      responses: { '200': { description: Safe settings and provider status } }
    delete:
      description: Requires ai:configure; clears stored AI settings.
      responses: { '200': { description: Safe settings and provider status } }
  /admin/ai-settings/test:
    post:
      description: Requires ai:configure; tests chat completion connectivity without returning secrets.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSettings' }
      responses: { '200': { description: Provider test result } }
  /admin/ai-usage:
    get:
      description: Requires ai:configure; returns tenant AI usage logs, grouped summary and monthly quota status. quota=0 means unlimited. AI-only endpoints may reject exhausted quota, while dish search and meal recommendation degrade to rules and lexical retrieval.
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200': { description: Usage logs, summary and quota, content: { application/json: { schema: { $ref: '#/components/schemas/AiUsageResponse' } } } }
  /admin/retrieval/status:
    get:
      description: Tenant-scoped retrieval index health and statistics. Requires audit:read. PostgreSQL reports ready=false unless vector, pg_trgm, vector(1536), HNSW and trigram indexes are all present; SQLite reports lexical_fallback mode.
      responses:
        '200': { description: Index readiness, counts, latest indexing time and failures, content: { application/json: { schema: { $ref: '#/components/schemas/RetrievalIndexStatus' } } } }
        '403': { description: audit:read permission required }
  /admin/retrieval/reindex:
    post:
      description: Idempotently rebuild tenant-scoped dish and/or health-knowledge documents. Requires dish:write. Reindexing refreshes document content and embeddings; live menu inventory is joined at query time and is not embedded. When AI quota is exhausted, lexical indexing still completes and quotaExhausted is returned.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetrievalReindexRequest' }
      responses:
        '200': { description: Reindex run summary, content: { application/json: { schema: { $ref: '#/components/schemas/RetrievalReindexResponse' } } } }
        '403': { description: dish:write permission required }
        '500': { description: PostgreSQL retrieval extensions or indexes are not ready }
  /admin/stalls:
    post:
      description: Create a stall directly under a dining area whose parent is one of the four fixed venues. Requires stall:write. Direct placement under a top-level venue and new parentId relationships are rejected; historical records remain readable and can be migrated through the update endpoint.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StallInput' }
      responses:
        '201': { description: Full state plus savedId, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSavedResponse' } } } }
        '400': { description: Invalid dining area, legacy parentId, or missing fields; stable codes include STALL_CANTEEN_NOT_FOUND, STALL_AREA_REQUIRED and STALL_PARENT_LEGACY_ONLY }
  /admin/stalls/{id}:
    put:
      description: Update a stall. Requires stall:write. Historical direct-venue stalls may be edited without changing canteenId. Moving a stall, or flattening a historical child stall, requires a valid dining-area target. New or changed parent relationships are rejected.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StallInput' }
      responses:
        '200': { description: Full state plus savedId, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSavedResponse' } } } }
        '400': { description: Invalid target or hierarchy change; stable codes include STALL_CANTEEN_NOT_FOUND, STALL_AREA_REQUIRED, STALL_PARENT_LEGACY_ONLY, STALL_PARENT_SELF, STALL_PARENT_NESTED and STALL_PARENT_CROSS_CANTEEN }
        '404': { description: Stall not found }
    delete:
      description: Delete stall. Requires stall:delete.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Full state }
        '409': { description: Cannot delete a stall while it still has child stalls; code STALL_HAS_CHILDREN }
        '404': { description: Stall not found }
  /admin/environment:
    get:
      description: Get campus environment (temperature, weather). Requires environment:write.
      responses: { '200': { description: Campus environment, content: { application/json: { schema: { type: object, properties: { environment: { $ref: '#/components/schemas/CampusEnvironment' } } } } } } }
    put:
      description: Update campus environment. Requires environment:write.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampusEnvironment' }
      responses:
        '200': { description: Updated environment }
        '400': { description: Invalid temperature or weather label }
  /preferences/dishes:
    get:
      description: Get authenticated user's dish preferences. Requires authentication.
      responses: { '200': { description: User dish preferences, content: { application/json: { schema: { type: object, properties: { preferences: { type: array, items: { $ref: '#/components/schemas/DishPreference' } } } } } } } }
    put:
      description: Update dish preference (toggle favorite). Requires preference:write.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [dishId], properties: { dishId: { type: string }, favorite: { type: boolean } } }
      responses:
        '200': { description: Updated preferences }
        '404': { description: Dish not found }
  /preferences/dishes/{id}/drawn:
    post:
      description: Record dish as drawn (seen in recommendation). Requires preference:write.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated preference } }
  /preferences/dishes/{id}/eaten:
    post:
      description: Record dish as eaten. Requires preference:write.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated preference } }
  /admin/reviews/{id}/status:
    put:
      description: Alias of PATCH for clients using PUT. Requires review:moderate.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewStatusUpdate' }
      responses:
        '200': { description: Updated review status }
        '400': { description: Invalid status }
        '404': { description: Review not found }
    patch:
      description: Update review moderation status (approve/reject). Requires review:moderate.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewStatusUpdate' }
      responses:
        '200': { description: Updated review status }
        '400': { description: Invalid status }
        '404': { description: Review not found }
  /admin/reviews:
    get:
      description: List reviews for moderation. Requires review:moderate. Without status, only pending reviews are returned, newest first; target filters are applied before pagination.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, all], default: pending } }
        - { name: targetType, in: query, schema: { type: string, enum: [dish, canteen] } }
        - { name: canteenId, in: query, schema: { type: string } }
        - { name: stallId, in: query, schema: { type: string } }
        - { name: dishId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Moderation reviews with author and enriched dish, stall, and canteen context }
        '400': { description: Invalid status or targetType }
        '403': { description: Permission denied }
  /admin/posts:
    get:
      description: List campus posts for moderation. Requires post:moderate.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, all] } }
        - { name: targetType, in: query, schema: { type: string, enum: [dish, canteen] } }
        - { name: canteenId, in: query, schema: { type: string } }
        - { name: stallId, in: query, schema: { type: string } }
        - { name: dishId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { '200': { description: Campus post moderation page with author, target context, and linked review status }, '400': { description: Invalid status or targetType }, '403': { description: Permission denied } }
  /admin/posts/{id}/status:
    patch:
      description: Moderate a campus post. Approving a rated dish post creates or reactivates exactly one linked approved review. Requires post:moderate.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, approved, rejected] }
      responses: { '200': { description: Updated post with linkedReviewId }, '400': { description: Invalid moderation status }, '403': { description: Permission denied }, '404': { description: Post not found } }
