name: smart-canteen-collector

services:
  collector-api:
    build:
      context: .
      dockerfile: Dockerfile.collector
      target: collector-api
    environment:
      NODE_ENV: production
      SMART_CANTEEN_SECRET: ${COLLECTOR_SECRET:?set COLLECTOR_SECRET in .env.collector}
      COLLECTOR_HOST: 0.0.0.0
      COLLECTOR_PORT: 8790
      COLLECTOR_DATABASE_URL: postgres://${COLLECTOR_POSTGRES_USER:-collector}:${COLLECTOR_POSTGRES_PASSWORD:?set COLLECTOR_POSTGRES_PASSWORD}@collector-postgres:5432/${COLLECTOR_POSTGRES_DB:-collector}
      COLLECTOR_CATALOG_FILE: /app/data/catalog.json
      COLLECTOR_EMBEDDED_WORKER: 0
      COLLECTOR_S3_BUCKET: ${COLLECTOR_S3_BUCKET:-collector-images}
      COLLECTOR_S3_REGION: us-east-1
      COLLECTOR_S3_ENDPOINT: http://collector-minio:9000
      COLLECTOR_S3_ACCESS_KEY_ID: ${COLLECTOR_MINIO_USER:-collector}
      COLLECTOR_S3_SECRET_ACCESS_KEY: ${COLLECTOR_MINIO_PASSWORD:?set COLLECTOR_MINIO_PASSWORD}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gpt-4o-mini}
    depends_on:
      collector-postgres: { condition: service_healthy }
      collector-minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/api/collector/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  collector-worker:
    build:
      context: .
      dockerfile: Dockerfile.collector
      target: collector-api
    command: ["node", "collector-server/worker.js"]
    environment:
      NODE_ENV: production
      SMART_CANTEEN_SECRET: ${COLLECTOR_SECRET:?set COLLECTOR_SECRET in .env.collector}
      COLLECTOR_DATABASE_URL: postgres://${COLLECTOR_POSTGRES_USER:-collector}:${COLLECTOR_POSTGRES_PASSWORD:?set COLLECTOR_POSTGRES_PASSWORD}@collector-postgres:5432/${COLLECTOR_POSTGRES_DB:-collector}
      COLLECTOR_S3_BUCKET: ${COLLECTOR_S3_BUCKET:-collector-images}
      COLLECTOR_S3_REGION: us-east-1
      COLLECTOR_S3_ENDPOINT: http://collector-minio:9000
      COLLECTOR_S3_ACCESS_KEY_ID: ${COLLECTOR_MINIO_USER:-collector}
      COLLECTOR_S3_SECRET_ACCESS_KEY: ${COLLECTOR_MINIO_PASSWORD:?set COLLECTOR_MINIO_PASSWORD}
    depends_on:
      collector-postgres: { condition: service_healthy }
      collector-minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  collector-web:
    build:
      context: .
      dockerfile: Dockerfile.collector
      target: collector-web
    depends_on:
      collector-api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${COLLECTOR_WEB_PORT:-8081}:80"
    restart: unless-stopped

  collector-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${COLLECTOR_POSTGRES_DB:-collector}
      POSTGRES_USER: ${COLLECTOR_POSTGRES_USER:-collector}
      POSTGRES_PASSWORD: ${COLLECTOR_POSTGRES_PASSWORD:?set COLLECTOR_POSTGRES_PASSWORD}
    volumes: [collector_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${COLLECTOR_POSTGRES_PORT:-55433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  collector-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${COLLECTOR_MINIO_USER:-collector}
      MINIO_ROOT_PASSWORD: ${COLLECTOR_MINIO_PASSWORD:?set COLLECTOR_MINIO_PASSWORD}
    volumes: [collector_minio:/data]
    ports:
      - "127.0.0.1:${COLLECTOR_MINIO_PORT:-9010}:9000"
      - "127.0.0.1:${COLLECTOR_MINIO_CONSOLE_PORT:-9011}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 8s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  collector-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${COLLECTOR_MINIO_USER:-collector}
      MINIO_ROOT_PASSWORD: ${COLLECTOR_MINIO_PASSWORD:?set COLLECTOR_MINIO_PASSWORD}
      BUCKET: ${COLLECTOR_S3_BUCKET:-collector-images}
    depends_on:
      collector-minio: { condition: service_healthy }
    entrypoint: ["sh", "-ec", "mc alias set local http://collector-minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; mc mb --ignore-existing \"local/$${BUCKET}\"; mc anonymous set none \"local/$${BUCKET}\""]
    restart: "no"

volumes:
  collector_postgres:
  collector_minio:
